name: Android release APK

# Manual only: Actions tab > Android release APK > Run workflow.
#
# Signing: if the repository secrets below exist, the APK is signed with your
# release keystore. If they do not, the build still runs but is signed with the
# debug key (installable for sideloading, not suitable for the Play Store).
#
#   ANDROID_KEYSTORE_BASE64    base64 of the .keystore / .jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # TMDB poster lookups. Expo inlines EXPO_PUBLIC_* values when Metro bundles the JS, so
      # this must be set for the Gradle build. Either secret name works.
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY || secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CHRONICLE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Note signing mode
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Signing with the release keystore." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found. Building a release APK signed with the DEBUG key."
            echo "Signed with the debug key (no release keystore secret configured)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note poster key
        run: |
          if [ -z "$EXPO_PUBLIC_TMDB_API_KEY" ]; then
            echo "::warning::No TMDB key (secret EXPO_PUBLIC_TMDB_API_KEY or TMDB_API_KEY). The app will build without film and TV posters."
          fi

      - name: Prebuild Android native project (Expo)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CHRONICLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          CHRONICLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRONICLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONICLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
