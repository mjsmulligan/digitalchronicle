- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '18'
    cache: 'npm'

- name: Install mobile dependencies
  working-directory: mobile
  run: npm ci

- name: Setup Java (Temurin 11)
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '11'

- name: Install Android command-line tools and SDK packages
  run: |
    mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    cd $ANDROID_SDK_ROOT
    curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
    unzip -q cmdline-tools.zip -d cmdline-tools
    mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
    mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses
    sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

- name: Prebuild Android native project (Expo)
  working-directory: mobile
  run: |
    npx expo prebuild --platform android --no-install

- name: Make gradlew executable
  run: chmod +x mobile/android/gradlew

- name: Build debug APK
  run: |
    cd mobile/android
    ./gradlew assembleDebug --no-daemon
  env:
    ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
    ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

- name: Upload debug APK artifact
  uses: actions/upload-artifact@v4
  with:
    name: app-debug-apk
    path: mobile/android/app/build/outputs/**/*.apk
