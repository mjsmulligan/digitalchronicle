name: Android debug APK

on:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # TMDB poster lookups. Expo inlines EXPO_PUBLIC_* values when Metro bundles the JS, so
      # this must be set for the Gradle build. Either secret name works.
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY || secrets.TMDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image already ships the Android SDK. Accept its
      # licences so Gradle can download whichever platform and build-tools
      # versions the generated project asks for.
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Note poster key
        run: |
          if [ -z "$EXPO_PUBLIC_TMDB_API_KEY" ]; then
            echo "::warning::No TMDB key (secret EXPO_PUBLIC_TMDB_API_KEY or TMDB_API_KEY). The app will build without film and TV posters."
          fi

      - name: Prebuild Android native project (Expo)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
